<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPCI SERVICE - Commande</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #0755a5;
    }

    p {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #0755a5;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>IPCI SERVICE</h1>

  <p>La boîte des opportunités numériques à des prix raisonnables.</p>

  <form id="commandeForm">

    <label>Nom complet</label>
    <input type="text" id="nom" required>

    <label>Téléphone</label>
    <input type="tel" id="telephone" required>

    <label>Offre</label>
    <select id="offre" required>
      <option value="">Choisir une offre</option>
      <option value="IPTV 6 mois" data-prix="20000">IPTV 6 mois - 20 000 FCFA</option>
      <option value="IPTV 1 an" data-prix="30000">IPTV 1 an - 30 000 FCFA</option>
      <option value="Box TV Android" data-prix="25000">Box TV Android - 25 000 FCFA</option>
    </select>

    <label>Mode de paiement</label>
    <select id="paiement" required>
      <option value="">Choisir</option>
      <option value="Orange Money">Orange Money</option>
      <option value="MTN Money">MTN Money</option>
      <option value="Wave">Wave</option>
    </select>

    <label>Message</label>
    <textarea id="messageClient" rows="4"></textarea>

    <button type="submit" id="payerBtn">
      Payer maintenant
    </button>

    <div id="message"></div>

  </form>

</div>

<script>
document.getElementById("commandeForm").addEventListener("submit", async function(e) {

  e.preventDefault();

  const bouton = document.getElementById("payerBtn");
  const message = document.getElementById("message");

  const offreSelect = document.getElementById("offre");
  const option = offreSelect.options[offreSelect.selectedIndex];

  const nom = document.getElementById("nom").value;
  const telephone = document.getElementById("telephone").value;
  const offre = offreSelect.value;
  const prix = option.getAttribute("data-prix");
  const paiement = document.getElementById("paiement").value;
  const messageClient = document.getElementById("messageClient").value;

  bouton.disabled = true;
  bouton.textContent = "Connexion au paiement...";
  message.textContent = "";

  try {

    const response = await fetch("/.netlify/functions/create-paiement", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        nom: nom,
        telephone: telephone,
        offre: offre,
        prix: prix,
        paiement: paiement,
        message: messageClient
      })
    });

    const text = await response.text();

    let data;

    try {
      data = JSON.parse(text);
    } catch (error) {
      throw new Error("Netlify ne renvoie pas du JSON. Vérifie la fonction create-paiement.");
    }

    if (!response.ok || !data.success) {
      throw new Error(data.error || "Erreur lors de la création du paiement.");
    }

    if (data.url) {
      window.location.href = data.url;
      return;
    }

    throw new Error("Aucune URL de paiement reçue.");

  } catch (error) {

    message.style.color = "red";
    message.textContent = "Erreur : " + error.message;

    bouton.disabled = false;
    bouton.textContent = "Payer maintenant";
  }

});
</script>

</body>
</html>

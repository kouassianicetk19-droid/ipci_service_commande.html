<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPCI SERVICE - Commande</title>  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #0b3d91;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin-top: 10px;
      font-size: 18px;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #0b3d91;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 7px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #0b3d91;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #062b68;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .contact {
      text-align: center;
      margin-top: 25px;
      font-size: 16px;
    }

    #resultat {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #0b3d91;
      color: white;
      margin-top: 30px;
    }
  </style></head><body><header>
  <h1>IPCI SERVICE</h1>
  <p>La boîte des opportunités numériques à des prix raisonnables</p>
</header><div class="container">  <div class="card"><h2>Commander votre abonnement</h2>

<form id="commandeForm">

  <label for="nom">Nom complet</label>
  <input type="text" id="nom" required>

  <label for="telephone">Numéro de téléphone</label>
  <input type="tel" id="telephone" required>

  <label for="offre">Choisissez votre offre</label>
  <select id="offre" required>
    <option value="">-- Choisir une offre --</option>
    <option value="IPTV 6 mois" data-prix="20000">
      IPTV 6 mois - 20 000 FCFA
    </option>
    <option value="IPTV 1 an" data-prix="30000">
      IPTV 1 an - 30 000 FCFA
    </option>
    <option value="Box TV" data-prix="25000">
      Box TV - 25 000 FCFA
    </option>
  </select>

  <label for="paiement">Mode de paiement</label>
  <select id="paiement" required>
    <option value="">-- Choisir --</option>
    <option value="Orange Money">Orange Money</option>
    <option value="Wave">Wave</option>
    <option value="MTN Money">MTN Money</option>
  </select>

  <label for="message">Message</label>
  <textarea
    id="message"
    rows="4"
    placeholder="Informations complémentaires"
  ></textarea>

  <button type="submit" id="payerBtn">
    Payer maintenant
  </button>

</form>

<div id="resultat"></div>

<div class="contact">
  <p><strong>IPCI SERVICE</strong></p>
  <p>Abonnements IPTV • Box TV • Solutions TV</p>
</div>

  </div></div><footer>
  © 2026 IPCI SERVICE - Tous droits réservés
</footer><script>
document.getElementById("commandeForm").addEventListener("submit", async function(event) {

  event.preventDefault();

  const nom = document.getElementById("nom").value.trim();
  const telephone = document.getElementById("telephone").value.trim();
  const offreElement = document.getElementById("offre");
  const offre = offreElement.value;
  const prix = Number(
    offreElement.options[offreElement.selectedIndex].dataset.prix
  );
  const paiement = document.getElementById("paiement").value;
  const message = document.getElementById("message").value.trim();

  const bouton = document.getElementById("payerBtn");
  const resultat = document.getElementById("resultat");

  bouton.disabled = true;
  bouton.textContent = "Préparation du paiement...";
  resultat.textContent = "";

  try {

    const response = await fetch("/.netlify/functions/create-payment", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        nom,
        telephone,
        offre,
        prix,
        paiement,
        message
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Erreur lors de la création du paiement.");
    }

    if (data.url) {
      window.location.href = data.url;
    } else {
      throw new Error("Lien de paiement non reçu.");
    }

  } catch (error) {

    resultat.textContent = "Erreur : " + error.message;
    resultat.style.color = "red";

    bouton.disabled = false;
    bouton.textContent = "Payer maintenant";
  }

});
</script></body>
</html>
